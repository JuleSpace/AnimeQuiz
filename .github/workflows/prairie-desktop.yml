# Construit l'appli de bureau Poké Prairie (Windows) et la publie dans la release « prairie-latest ».
# Lien de téléchargement stable : https://github.com/JuleSpace/AnimeQuiz/releases/download/prairie-latest/Poke-Prairie-Setup.exe
name: Poké Prairie (appli de bureau)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['desktop/**', '.github/workflows/prairie-desktop.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Construire
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: poke-prairie-windows
          path: desktop/release/*.exe
      - name: Publier dans la release prairie-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prairie-latest >/dev/null 2>&1 || gh release create prairie-latest --title "Poké Prairie (appli de bureau)" --notes "Dernière version de l'appli de bureau Poké Prairie. Télécharge Poke-Prairie-Setup.exe (installation) ou Poke-Prairie-portable.exe (sans installation)."
          gh release upload prairie-latest desktop/release/Poke-Prairie-Setup.exe desktop/release/Poke-Prairie-portable.exe --clobber
