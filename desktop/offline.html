<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Poké Prairie</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: system-ui, sans-serif; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 84px; display: flex; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(126, 205, 96, 0.96), rgba(74, 165, 64, 0.98)); color: #fff; border-radius: 18px 18px 0 0; -webkit-app-region: drag; }
  b { font-size: 18px; }
  span { flex: 1; font-size: 14px; opacity: 0.95; }
  button { -webkit-app-region: no-drag; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: #fff; color: #2a7f33; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
  <div class="bar">
    <b>Poké Prairie</b>
    <span>Pas de connexion pour le tout premier lancement. Ensuite, le jeu marche aussi hors ligne.</span>
    <button onclick="location.href = new URLSearchParams(location.search).get('url') || 'https://bullys-lair.dev/#prairie'">Réessayer</button>
  </div>
</body>
</html>
